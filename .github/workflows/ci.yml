name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agentops-backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'apps/agentops-backend/go.mod'
          cache-dependency-path: apps/agentops-backend/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Test with coverage
        run: go test ./... -count=1 -coverprofile=coverage.out -covermode=count
      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tail -1
          echo "### Coverage" >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out | tail -1 >> $GITHUB_STEP_SUMMARY
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/agentops-backend/coverage.out
      - name: Build all binaries
        run: |
          go build -o /tmp/api    ./cmd/api
          go build -o /tmp/worker ./cmd/worker
          go build -o /tmp/cli    ./cmd/cli
