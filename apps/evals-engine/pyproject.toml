[project]
name = "evals-engine"
version = "0.1.0"
description = "ChronoBunker evals engine: LLM-as-a-Judge and STRIDE red-teaming CLI."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"