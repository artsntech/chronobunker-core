# ChronoBunker Core - Model routing policy.
# Each route maps a task type to a primary model and a fallback chain.
# The router tries the primary first; if it fails or is circuit-broken,
# it tries each fallback in order.

version: 1

routes:
  triage:
    primary: groq/llama-3.1-8b
    fallback:
      - groq/llama-3.3-70b
      - openai/gpt-4o-mini
    max_cost_per_call: 0.005

  reasoning:
    primary: anthropic/claude-3.5-sonnet
    fallback:
      - openai/gpt-4o
      - xai/grok-2
    max_cost_per_call: 0.10

  vision:
    primary: google/gemini-1.5-flash
    fallback:
      - google/gemini-1.5-pro
      - anthropic/claude-3.5-sonnet
    max_cost_per_call: 0.05